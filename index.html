<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW Server Hack Terminal</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
        }

        .servers-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .server-box {
            flex: 1;
            border: 1px solid #00ff00;
            padding: 10px;
            text-align: center;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 5px #00ff00;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .terminal {
            width: 100%;
            max-width: 800px;
            flex: 1;
            border: 2px solid #00ff00;
            background-color: #000;
            padding: 15px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.5);
            box-sizing: border-box;
        }

        .terminal p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 5px #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #00ff00;
            color: #000;
        }

        button:disabled {
            border-color: #555;
            color: #555;
            text-shadow: none;
            box-shadow: none;
            cursor: not-allowed;
            background-color: transparent;
        }

        /* Custom Scrollbar for terminal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000; 
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff00; 
        }
    </style>
</head>
<body>

    <div class="header">SYSTEM BREACH: PW DATABASE TARGETED</div>

    <div class="servers-container">
        <div id="srv1" class="server-box">SERVER 01: IDLE</div>
        <div id="srv2" class="server-box">SERVER 02: IDLE</div>
        <div id="srv3" class="server-box">SERVER 03: IDLE</div>
    </div>

    <div class="terminal" id="terminal-output">
        <p>> System ready. Waiting for user command...</p>
    </div>

    <div class="controls">
        <button id="hack-btn" onclick="initiateHack()">[ INITIATE SEARCH PROTOCOL ]</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal-output');
        const hackBtn = document.getElementById('hack-btn');

        // Utility function to wait
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Servers details
        const servers = [
            { id: 'srv1', name: 'PW_NODE_ALPHA' },
            { id: 'srv2', name: 'PW_NODE_BETA' },
            { id: 'srv3', name: 'PW_NODE_GAMMA' }
        ];

        async function typeLog(text, color = "#00ff00") {
            const p = document.createElement('p');
            p.style.color = color;
            terminal.appendChild(p);
            
            for (let i = 0; i < text.length; i++) {
                p.innerHTML += text.charAt(i);
                terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
                await sleep(20); // Typing speed
            }
        }

        async function initiateHack() {
            // Reset UI
            terminal.innerHTML = '';
            hackBtn.disabled = true;
            hackBtn.innerText = "[ SEARCHING... ]";

            servers.forEach(s => {
                document.getElementById(s.id).innerText = `${s.name}: WAITING`;
                document.getElementById(s.id).style.color = "#00ff00";
                document.getElementById(s.id).style.borderColor = "#00ff00";
            });

            await typeLog("> INITIATING HACK SEQUENCE...");
            await sleep(500);

            for (let i = 0; i < servers.length; i++) {
                let srv = servers[i];
                let srvBox = document.getElementById(srv.id);

                await typeLog(`\n> -----------------------------------`);
                await typeLog(`> TARGET LOCKED: ${srv.name}`);
                
                srvBox.innerText = `${srv.name}: CONNECTING`;
                srvBox.style.color = "yellow";
                srvBox.style.borderColor = "yellow";
                
                await typeLog(`> Extracting search code payload...`);
                await sleep(600);
                await typeLog(`> Injecting code into ${srv.name}...`);
                await sleep(800);

                srvBox.innerText = `${srv.name}: SEARCHING`;

                // Loading Spinner Animation
                let loadElement = document.createElement('p');
                loadElement.style.color = "cyan";
                terminal.appendChild(loadElement);
                
                const frames = ['|', '/', '-', '\\'];
                for (let j = 0; j < 15; j++) {
                    loadElement.innerText = `> Scanning directories for uploaded files... ${frames[j % 4]}`;
                    terminal.scrollTop = terminal.scrollHeight;
                    await sleep(150);
                }

                // Result for this server
                await typeLog(`> [ERROR] FILE NOT FOUND IN DATABASE.`, "red");
                await typeLog(`> STATUS: NOT UPLOADED YET`, "red");
                
                srvBox.innerText = `${srv.name}: NOT UPLOADED`;
                srvBox.style.color = "red";
                srvBox.style.borderColor = "red";
                
                await sleep(1000);

                if (i < servers.length - 1) {
                    await typeLog(`> Shifting IP and switching to next server...`, "yellow");
                    await sleep(1000);
                }
            }

            await typeLog(`\n> -----------------------------------`);
            await typeLog(`> SEARCH OPERATION COMPLETED.`, "cyan");
            await typeLog(`> FINAL RESULT: NO FILES UPLOADED ON ANY SERVER. TRY AGAIN LATER.`, "cyan");

            // Re-enable button
            hackBtn.disabled = false;
            hackBtn.innerText = "[ REFRESH & SEARCH AGAIN ]";
        }
    </script>
</body>
</html>
