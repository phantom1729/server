<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PW DEEP SEARCH TERMINAL</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .grid-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .server { border: 2px solid #00ff41; padding: 15px; flex: 1; text-align: center; }
        .status { font-weight: bold; margin-top: 10px; display: block; }
        #terminal { border: 1px solid #333; padding: 15px; height: 300px; overflow-y: auto; background: #000; }
        button { background: #004411; color: #00ff41; border: 1px solid #00ff41; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00ff41; color: #000; }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="server" id="s1">MILESTONE-01<br><span class="status" id="st1">STANDBY</span></div>
    <div class="server" id="s2">IDS-GATEWAY<br><span class="status" id="st2">STANDBY</span></div>
    <div class="server" id="s3">FIREWALL-CORE<br><span class="status" id="st3">STANDBY</span></div>
</div>

<div id="terminal"></div>
<button onclick="startHack()">[ EXECUTE SEARCH SEQUENCE ]</button>

<script>
    const term = document.getElementById('terminal');
    
    function log(msg, color = "#00ff41") {
        const p = document.createElement('p');
        p.style.color = color;
        p.innerHTML = `> ${msg}`;
        term.appendChild(p);
        term.scrollTop = term.scrollHeight;
    }

    async function startHack() {
        term.innerHTML = ""; // Clear console
        const servers = [1, 2, 3];
        
        log("ESTABLISHING ENCRYPTED TUNNEL...");
        await new Promise(r => setTimeout(r, 1000));

        for(let i of servers) {
            document.getElementById(`st${i}`).innerText = "LOADING...";
            log(`PINGING SERVER ${i}...`);
            await new Promise(r => setTimeout(r, 800));
            
            // Simulating search
            document.getElementById(`st${i}`).innerText = "SEARCHING...";
            log(`SEARCHING FOR UPLOADED FILES ON SRV-${i}...`, "#ffff00");
            
            for(let j=0; j<5; j++) {
                await new Promise(r => setTimeout(r, 400));
                log(`PACKET_INDEX_${j}: NO MATCH FOUND`, "#555");
            }
            
            document.getElementById(`st${i}`).innerText = "NOT FOUND";
            log(`CRITICAL: NO FILES DETECTED ON SRV-${i}`, "red");
        }

        log("SEQUENCE FINISHED: NO DATA UPLOADED.", "cyan");
    }
</script>
</body>
</html>
