<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PW Server Scanner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top left,#5b21b6 0%,transparent 35%),
    radial-gradient(circle at bottom right,#7c3aed 0%,transparent 35%),
    #0f172a;
    z-index:-1;
}

.container{
    width:90%;
    max-width:1100px;
}

.logo{
    text-align:center;
    font-size:50px;
    font-weight:bold;
    margin-bottom:40px;
    letter-spacing:3px;
    color:#facc15;
    text-shadow:0 0 20px rgba(250,204,21,0.8);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

.servers{
    display:flex;
    gap:25px;
    justify-content:center;
    flex-wrap:wrap;
}

.server{
    width:300px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 25px rgba(124,58,237,0.3);
}

.server::before{
    content:'';
    position:absolute;
    top:-100%;
    left:-40%;
    width:80px;
    height:300%;
    background:rgba(255,255,255,0.15);
    transform:rotate(25deg);
    animation:shine 4s linear infinite;
}

@keyframes shine{
    100%{
        left:140%;
    }
}

.server h2{
    text-align:center;
    margin-bottom:20px;
    color:#c084fc;
}

.status{
    margin-top:15px;
    font-size:14px;
    color:#d1d5db;
    height:20px;
}

.progress{
    width:100%;
    height:12px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#facc15);
    border-radius:20px;
    animation:loading 3s infinite;
}

@keyframes loading{
    0%{width:0%;}
    50%{width:90%;}
    100%{width:0%;}
}

.loader{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:8px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#facc15;
    animation:bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:0.2s;
}
.dot:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
        opacity:0.4;
    }
    50%{
        transform:translateY(-10px);
        opacity:1;
    }
}

.refresh-btn{
    display:block;
    margin:45px auto 0;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#7c3aed,#facc15);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(124,58,237,0.5);
}

.refresh-btn:hover{
    transform:scale(1.08);
}

.scan-line{
    position:absolute;
    width:100%;
    height:3px;
    background:linear-gradient(90deg,transparent,#22d3ee,transparent);
    top:0;
    left:0;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    0%{top:0;}
    100%{top:100%;}
}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="logo">PW SERVER SCANNER</div>

    <div class="servers">

        <div class="server">
            <div class="scan-line"></div>
            <h2>Server 01</h2>

            <div class="progress">
                <div class="bar"></div>
            </div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status" id="status1">
                Searching upload status...
            </div>
        </div>

        <div class="server">
            <div class="scan-line"></div>
            <h2>Server 02</h2>

            <div class="progress">
                <div class="bar"></div>
            </div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status" id="status2">
                Checking data...
            </div>
        </div>

        <div class="server">
            <div class="scan-line"></div>
            <h2>Server 03</h2>

            <div class="progress">
                <div class="bar"></div>
            </div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status" id="status3">
                Waiting for upload...
            </div>
        </div>

    </div>

    <button class="refresh-btn" onclick="refreshServers()">
        REFRESH SERVERS
    </button>

</div>

<script>

const messages = [
    "Searching upload status...",
    "Still not uploaded...",
    "Checking server response...",
    "Loading latest data...",
    "Scanning files...",
    "Upload not detected...",
    "Retrying connection...",
    "Refreshing server...",
    "Verifying update..."
];

function randomMessage(){
    return messages[Math.floor(Math.random()*messages.length)];
}

function updateStatuses(){
    document.getElementById("status1").innerText = randomMessage();
    document.getElementById("status2").innerText = randomMessage();
    document.getElementById("status3").innerText = randomMessage();
}

setInterval(updateStatuses,2000);

function refreshServers(){

    const btn = document.querySelector(".refresh-btn");

    btn.innerText = "REFRESHING...";
    btn.style.opacity = "0.7";

    updateStatuses();

    setTimeout(()=>{
        btn.innerText = "REFRESH SERVERS";
        btn.style.opacity = "1";
    },2000);
}

</script>

</body>
</html>
