<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PW Server Scanner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#020617;
    overflow:hidden;
    color:#00ff88;
    height:100vh;
}

/* MATRIX BG */

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* MAIN */

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.title{
    font-size:48px;
    color:#ffd500;
    text-shadow:0 0 20px #ffd500;
    margin-bottom:40px;
    letter-spacing:4px;
    animation:flicker 2s infinite;
}

@keyframes flicker{
    0%,100%{opacity:1;}
    50%{opacity:0.8;}
}

/* SERVER BOX */

.server-area{
    width:100%;
    max-width:1200px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.server{
    width:340px;
    height:420px;
    background:rgba(0,255,120,0.05);
    border:1px solid rgba(0,255,120,0.3);
    border-radius:18px;
    backdrop-filter:blur(8px);
    overflow:hidden;
    position:relative;
    box-shadow:
    0 0 25px rgba(0,255,120,0.2),
    inset 0 0 15px rgba(0,255,120,0.1);
}

/* SCAN LINE */

.scan{
    position:absolute;
    top:-100%;
    left:0;
    width:100%;
    height:100px;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(0,255,120,0.35),
        transparent
    );
    animation:scan 3s linear infinite;
}

@keyframes scan{
    100%{
        top:120%;
    }
}

.server-header{
    padding:18px;
    text-align:center;
    font-size:24px;
    color:#00ff88;
    border-bottom:1px solid rgba(0,255,120,0.2);
    background:rgba(0,255,120,0.05);
}

.logs{
    height:300px;
    overflow:hidden;
    padding:15px;
    font-size:13px;
    line-height:1.8;
}

.log{
    opacity:0;
    animation:fade 0.5s forwards;
}

@keyframes fade{
    to{
        opacity:1;
    }
}

/* LOADER */

.loader{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00ff88;
    animation:bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:0.2s;
}

.dot:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
        opacity:0.3;
    }
    50%{
        transform:translateY(-10px);
        opacity:1;
    }
}

/* BUTTON */

.refresh{
    margin-top:40px;
    padding:16px 45px;
    background:#00ff88;
    border:none;
    border-radius:50px;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 25px rgba(0,255,120,0.5);
}

.refresh:hover{
    transform:scale(1.08);
}

.status{
    text-align:center;
    margin-top:10px;
    color:#ffd500;
    font-size:14px;
}

</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="title">PW DARK SERVER ACCESS</div>

    <div class="server-area">

        <div class="server">
            <div class="scan"></div>
            <div class="server-header">SERVER 01</div>
            <div class="logs" id="logs1"></div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status">WAITING FOR RESPONSE...</div>
        </div>

        <div class="server">
            <div class="scan"></div>
            <div class="server-header">SERVER 02</div>
            <div class="logs" id="logs2"></div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status">SEARCHING FILES...</div>
        </div>

        <div class="server">
            <div class="scan"></div>
            <div class="server-header">SERVER 03</div>
            <div class="logs" id="logs3"></div>

            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="status">CONNECTING...</div>
        </div>

    </div>

    <button class="refresh" onclick="restartLogs()">
        REFRESH SERVERS
    </button>

</div>

<script>

/* MATRIX EFFECT */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for(let x=0;x<columns;x++){
    drops[x]=1;
}

function drawMatrix(){

    ctx.fillStyle="rgba(2,6,23,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff88";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text = letters.charAt(
            Math.floor(Math.random()*letters.length)
        );

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
            drops[i]*fontSize > canvas.height &&
            Math.random()>0.975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix,35);

/* SERVER LOGS */

const logs = [
    "[+] Connecting to PW secure server...",
    "[+] Changing proxy route...",
    "[+] Server changed successfully...",
    "[+] Starting uploaded file search...",
    "[+] Extracting source code...",
    "[+] Checking hidden uploads...",
    "[+] Access token generated...",
    "[+] Searching latest upload...",
    "[+] File hash matched...",
    "[+] Retry request sending...",
    "[+] Waiting for upload response...",
    "[!] Upload not detected...",
    "[!] Uploaded file not found...",
    "[!] Rechecking server database...",
    "[+] Scanning encrypted folders...",
    "[+] Searching backup servers...",
    "[!] No uploaded content available..."
];

function addLog(id){

    const box = document.getElementById(id);

    const div = document.createElement("div");
    div.className = "log";

    div.innerText =
        logs[Math.floor(Math.random()*logs.length)];

    box.appendChild(div);

    if(box.children.length > 14){
        box.removeChild(box.children[0]);
    }

    box.scrollTop = box.scrollHeight;
}

setInterval(()=>{
    addLog("logs1");
    addLog("logs2");
    addLog("logs3");
},1200);

function restartLogs(){

    document.getElementById("logs1").innerHTML="";
    document.getElementById("logs2").innerHTML="";
    document.getElementById("logs3").innerHTML="";
}

</script>

</body>
</html>
